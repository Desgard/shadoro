<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>提交线索 · 写真泥棒</title>
  <meta name="description" content="提交搬运、洗稿作品的线索，维护者核实后收录进榜单。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23120d0c'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23e5392f' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23e5392f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead compact">
    <p class="edge-print" aria-hidden="true"><span>SHADORO 400</span><span>▸ NEW FRAME</span><span><a href="./">← 返回榜单</a></span></p>
    <h1>提交线索</h1>
    <p class="lead">填好下面的链接，页面会带着内容跳转到 GitHub。<br>在 GitHub 上确认并提交后，维护者核实才会收录。</p>
  </header>

  <main>
    <form id="submission" class="submission" novalidate>
      <div class="field">
        <label for="work">搬运作品链接 <em>必填</em></label>
        <input id="work" name="work" type="text" required autocomplete="off" spellcheck="false" placeholder="https://www.xiaohongshu.com/explore/...">
        <small>小红书、抖音或微信公众号的作品链接，也可以直接粘贴 App 的分享文案</small>
      </div>
      <div class="field">
        <label for="original">原作链接 <em>必填</em></label>
        <input id="original" name="original" type="text" required autocomplete="off" spellcheck="false" placeholder="https://">
        <small>原作品的链接，可以是任意平台</small>
      </div>
      <div class="field">
        <label for="profile">作者主页链接 <em>必填</em></label>
        <input id="profile" name="profile" type="text" required autocomplete="off" spellcheck="false" placeholder="https://www.xiaohongshu.com/user/profile/...">
        <small>发布搬运作品的账号主页，自动提取失败时用它确认账号</small>
      </div>
      <div class="field">
        <label for="type">类型 <em>必填</em></label>
        <select id="type" name="type" required>
          <option>直接搬运</option>
          <option>改图搬运</option>
          <option>AI融图</option>
        </select>
      </div>
      <div class="field">
        <label for="note">备注</label>
        <textarea id="note" name="note" rows="3"></textarea>
        <small>选填。收录后会显示在榜单的对照记录中</small>
      </div>

      <p id="form-error" class="form-error" role="alert" hidden></p>
      <button type="submit">前往 GitHub 提交 ↗</button>
      <p class="form-notice">需要 GitHub 账号。提交的链接会公开显示在 Issue 中，请只填写公开链接，不要附上任何人的隐私信息。</p>
    </form>
  </main>

  <script src="submit.js" type="module"></script>
</body>
</html>
